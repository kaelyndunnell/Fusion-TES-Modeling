name: tes-pav-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.13
  - jupyter-book
  - jupytext # necessary to open MyST files using BinderHub https://jupyterbook.org/en/stable/interactive/launchbuttons.html#launchbuttons-binder
  - sphinx-tags
  - matplotlib
  - meshio[all]
  - ipykernel
  - nbconvert
  - fenics-dolfinx
  - festim
  - python-gmsh
  - shapely
  - scipy
  - pip=23.3
  - setuptools<82
  - wheel<0.45
  - pip:
    - pyparsing
    - h-transport-materials==0.18
    - pyvista[all,trame]  # trame cannot be installed on conda
    - foam2dolfinx
